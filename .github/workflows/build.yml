name: Build Android APK

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Make Gradle Wrapper Executable
        run: chmod +x ./gradlew

      - name: Build Standalone Debug APK with Gradle
        run: ./gradlew :app:assembleStandaloneDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fsclock-apk
          path: app/build/outputs/apk/standalone/debug/*.apk
